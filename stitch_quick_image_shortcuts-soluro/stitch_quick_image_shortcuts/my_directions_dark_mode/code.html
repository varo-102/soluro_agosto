<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Copied to clipboard
    </div>
<script>
        // Micro-interaction for copying data
        function copyBranchInfo(btn) {
            const card = btn.closest('article');
            const inputs = card.querySelectorAll('input, textarea');
            
            const name = inputs[0].value || 'Unknown Branch';
            const address = inputs[1].value || 'No address provided';
            const mapLink = inputs[2].value || 'No map link';

            const textToCopy = `Name: ${name}\nAddress: ${address}\nMaps: ${mapLink}`;

            // Provide visual feedback on the button
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check</span> Copied!`;
            btn.classList.add('bg-text-on-dark', 'text-text-on-light');
            btn.classList.remove('bg-amarillo-sol', 'text-text-on-light');

            // Show Toast
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            // Reset after delay
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-text-on-dark', 'text-text-on-light');
                btn.classList.add('bg-amarillo-sol', 'text-text-on-light');
                
                toast.classList.add('opacity-0', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2000);

            // In a real app, use navigator.clipboard.writeText(textToCopy);
            console.log("Copied:\n" + textToCopy);
        }

        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
            }
        });
    </script>
